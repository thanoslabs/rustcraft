name: Release binaries

on:
  push:
    branches:
      - main
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  build:
    name: Build ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-x86_64
            os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            binary: rustcraft-client
          - name: windows-x86_64
            os: windows-latest
            target: x86_64-pc-windows-msvc
            binary: rustcraft-client.exe
          - name: macos-arm64
            os: macos-15
            target: aarch64-apple-darwin
            binary: rustcraft-client
          - name: macos-x86_64
            os: macos-15
            target: x86_64-apple-darwin
            binary: rustcraft-client
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Build optimized client
        run: cargo build --release --package rustcraft-client --target ${{ matrix.target }}
      - name: Package executable (Unix)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          mkdir -p dist
          cp "target/${{ matrix.target }}/release/${{ matrix.binary }}" dist/
          cp README.md dist/README.md
          tar -czf "rustcraft-${{ matrix.name }}.tar.gz" -C dist .
      - name: Package executable (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Copy-Item "target/${{ matrix.target }}/release/${{ matrix.binary }}" dist/
          Copy-Item README.md dist/README.md
          Compress-Archive -Path dist/* -DestinationPath "rustcraft-${{ matrix.name }}.zip"
      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: rustcraft-${{ matrix.name }}
          path: rustcraft-${{ matrix.name }}.*
          if-no-files-found: error

  publish:
    name: Publish GitHub release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download all build artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: rustcraft-*
          path: dist
          merge-multiple: true
      - name: Publish tagged release
        env:
          GH_TOKEN: ${{ github.token }}
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
          RUN_NUMBER: ${{ github.run_number }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$REF_TYPE" == "tag" ]]; then
            TAG="$REF_NAME"
            if [[ ! "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$ ]]; then
              echo "Invalid version tag: $TAG" >&2
              exit 1
            fi
            EXTRA=()
          else
            TAG="v0.1.0-dev.$RUN_NUMBER"
            EXTRA=(--prerelease)
          fi

          # Re-running a workflow should update its existing release, not fail.
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$TAG" dist/* --repo "$GITHUB_REPOSITORY" --clobber
          else
            gh release create "$TAG" dist/* --repo "$GITHUB_REPOSITORY" \
              --target "$GITHUB_SHA" --generate-notes --title "Rustcraft $TAG" "${EXTRA[@]}"
          fi
